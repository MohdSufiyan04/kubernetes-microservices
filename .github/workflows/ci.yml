name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push user-service
        uses: docker/build-push-action@v4
        with:
          context: ./services/user-service
          push: true
          tags: mohdsufiyan04/user-service:${{ github.run_number }}

      - name: Build and push product-service
        uses: docker/build-push-action@v4
        with:
          context: ./services/product-service
          push: true
          tags: mohdsufiyan04/product-service:${{ github.run_number }}

      - name: Build and push gateway-service
        uses: docker/build-push-action@v4
        with:
          context: ./services/gateway-service
          push: true
          tags: mohdsufiyan04/gateway-service:${{ github.run_number }}

      - name: Update helm chart image tags
        run: |
          sed -i "s/tag: .*/tag: \"${{ github.run_number }}\"/" helm/user-service/values.yaml
          sed -i "s/tag: .*/tag: \"${{ github.run_number }}\"/" helm/product-service/values.yaml
          sed -i "s/tag: .*/tag: \"${{ github.run_number }}\"/" helm/gateway-service/values.yaml

      - name: Commit updated helm values
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add helm/*/values.yaml
          git commit -m "update image tags to ${{ github.run_number }}"
          git push